[package]
name = "processinator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Astronomy image processing: nonlinear stretching, gradient removal, starlet denoising, and FITS-to-image conversion"

[dependencies]
fitrs = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
thiserror = "2"
